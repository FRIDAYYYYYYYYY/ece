<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#16181c" media="(prefers-color-scheme: dark)" />
    <meta
      name="description"
      content="RailGuard AI — AI-powered precise train traffic control decision-support dashboard: CP-SAT optimisation, independent validation and live ESP32 hardware bridge."
    />
    <title>RailGuard AI · Train Traffic Control</title>
    <script>
      // Apply the saved / system colour scheme before first paint (no flash).
      (() => {
        try {
          const saved = localStorage.getItem('rg-theme')
          const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches
          document.documentElement.dataset.theme = saved || (prefersDark ? 'dark' : 'light')
        } catch {
          document.documentElement.dataset.theme = 'light'
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
